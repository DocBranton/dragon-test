# WDP-approved Databricks Apps DRAGON deployment route.
# Only a user-initiated GitLab pipeline can invoke DRAGON from this project.
# 'prod' is the bundle target; the workspace is advana-blade.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

include:
  - project: platform/dragon
    ref: main
    file: routes/databricks-app-deploy.yml

variables:
  DATABRICKS_HOST: "https://advana-blade.cloud.databricks.mil"
  DEPLOY_TARGET: "prod"
  DATABRICKS_PROJECT_DIR: "."
  DATABRICKS_JOB_FILE: "databricks.yml"
  DATABRICKS_BUNDLE_TARGET: "prod"
  DATABRICKS_BUNDLE_RUN_TARGET: "hello_world_app"
  DATABRICKS_DEPLOY_ONLY: "false"
